name: Build Docker image

on:
  push:

jobs:
  build:
    name: Build S13 training camps image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE_NAME: devopseasylearning/s13-training-camps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "${IMAGE_NAME}:${GITHUB_SHA}" --tag "${IMAGE_NAME}:latest" .

      - name: Show built Docker image
        run: docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' "${IMAGE_NAME}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: devopseasylearning
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
