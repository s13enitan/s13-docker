name: Build Docker image

on:
  push:

jobs:
  build:
    name: Build S13 training camps image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "s13-training-camps:${GITHUB_SHA}" .

      - name: Show built Docker image
        run: docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' "s13-training-camps:${GITHUB_SHA}"
