name: Build Docker image

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build S13 training camps image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE_NAME: devopseasylearning/s13-training-camps
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "${IMAGE_NAME}:${GITHUB_SHA}" --tag "${IMAGE_NAME}:latest" .

      - name: Show built Docker image
        run: docker image ls --no-trunc --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' "${IMAGE_NAME}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: devopseasylearning
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

      - name: Pull pushed image
        run: docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Start container from pushed image
        run: |
          docker network create s13-training-camps-preview
          docker run --detach --name s13-training-camps-ci --network s13-training-camps-preview --publish 127.0.0.1:8080:8080 "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Check health and show container
        run: |
          for attempt in $(seq 1 30); do
            if health_response=$(curl --fail --silent --max-time 3 http://127.0.0.1:8080/health); then
              courses_response=$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/courses)
              printf 'Health response: %s\n' "$health_response"
              printf 'Courses API response: %s\n' "$courses_response"
              docker ps --no-trunc --filter name=s13-training-camps-ci
              docker inspect --format 'Container state: {{.State.Status}}; health: {{.State.Health.Status}}' s13-training-camps-ci
              docker logs s13-training-camps-ci
              {
                echo '## Container smoke test'
                echo "- Image: \`${IMAGE_NAME}:${GITHUB_SHA}\`"
                echo "- Health: \`${health_response}\`"
                echo '- Courses API: returned successfully'
                echo '- Container status:'
                echo '```text'
                docker ps --no-trunc --filter name=s13-training-camps-ci
                docker inspect --format 'Container state: {{.State.Status}}; health: {{.State.Health.Status}}' s13-training-camps-ci
                echo '```'
                echo '- Container logs:'
                echo '```text'
                docker logs s13-training-camps-ci
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 60 seconds.' >&2
          docker ps --all --filter name=s13-training-camps-ci
          docker logs s13-training-camps-ci
          exit 1

      - name: Start temporary public preview
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker run --detach --network s13-training-camps-preview --name s13-training-camps-tunnel cloudflare/cloudflared:latest tunnel --no-autoupdate --url http://s13-training-camps-ci:8080
          preview_url=''
          for attempt in $(seq 1 30); do
            preview_url=$(docker logs s13-training-camps-tunnel 2>&1 | sed -nE 's#.*(https://[[:alnum:]-]+\.trycloudflare\.com).*#\1#p' | head -n 1)
            if [ -n "$preview_url" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$preview_url" ]; then
            echo 'Cloudflare Quick Tunnel did not provide a public URL within 60 seconds.' >&2
            docker logs s13-training-camps-tunnel
            exit 1
          fi
          echo "Temporary public preview: $preview_url"
          {
            echo '## Temporary public preview'
            echo
            echo "[Open S13 Training Camps]($preview_url)"
            echo
            echo 'This link is public and will remain available for 30 minutes while this workflow runs.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Temporary public preview::$preview_url"
          sleep 1800
